services:
  db:
    container_name: flectra-db
    image: postgres:${POSTGRES_VERSION}
    restart: ${RESTART_POLICY}
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    volumes:
      - ./postgresql:/var/lib/postgresql/data:rw
    networks:
      - flectra-network

  flectra:
    container_name: flectra
    image: flectrahq/flectra:${FLECTRA_VERSION}
    restart: ${RESTART_POLICY}
    environment:
      - HOST=${POSTGRES_HOST}
      - PORT=${POSTGRES_PORT}
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - flectra-data:/var/lib/flectra:rw
      - ./logs:/var/log/flectra:rw

    networks:
      - flectra-network
    ports:
      - "${FLECTRA_EXT_PORT}:7073"
      - "${FLECTRA_EXT_LIVECHAT_PORT}:7072"
    depends_on:
      - db

networks:
  flectra-network:
    driver: bridge

volumes:
  postgresql:
  flectra-data: